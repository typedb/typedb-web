[build]
base = "."
ignore = "/bin/false"

[build.processing.html]
pretty_urls = false

[context.production]
command = "NODE_OPTIONS=--max-old-space-size=6144 pnpm --filter typedb-web-main build:prod"
publish = "main/dist/main/browser"

[context.master]
command = "pnpm --filter typedb-web-main build:staging"
publish = "main/dist/main/browser"

[context.development]
command = "pnpm --filter typedb-web-main build:dev"
publish = "main/dist/main/browser"

[context.ssr]
command = "NODE_OPTIONS=--max-old-space-size=6144 pnpm --filter typedb-web-main build:ssr"
publish = "main/dist/main/browser"

[context.deploy-preview]
command = "pnpm --filter typedb-web-main build:dev"
publish = "main/dist/main/browser"


# EDGE FUNCTIONS

# request-filter declares its paths via in-source config
# (netlify/edge-functions/request-filter/request-filter.ts)

[[edge_functions]]
function = "docs-trailing-slash"
path = "/docs/*"

[[edge_functions]]
function = "echo"
path = "/api/echo"

[[edge_functions]]
function = "get-calendar-link"
path = "/api/calendar-link"

[[edge_functions]]
function = "send-deploy-notification-discord"
path = "/api/send-deploy-notification-discord"

[[edge_functions]]
function = "claude-code-joshbot-reviewer"
path = "/api/claude-code-joshbot-reviewer"


# REDIRECTS AND REWRITES

# ALIASES
# Keep indefinitely
# N.B. the semantically correct status code is 303, but this code is not supported by Netlify

[[redirects]]
from = "/discord"
to = "https://discord.com/invite/typedb"
status = 301

[[redirects]]
from = "/github"
to = "https://github.com/typedb"
status = 301

[[redirects]]
from = "/academy"
to = "/docs/academy/"
status = 302

[[redirects]]
from = "/docs"
to = "/docs/home/"
status = 301
force = true

[[redirects]]
from = "/docs/2.x/*"
to = "/docs/:splat"
status = 302

# PERMANENT RENAMES
# Keep indefinitely as they will be used by old blog posts and other articles on the Web

[[redirects]]
from = "/introduction"
to = "/docs/home/what-is-typedb"
status = 301

[[redirects]]
from = "/philosophy"
to = "/docs/home/what-is-typedb"
status = 301

[[redirects]]
from = "/deploy"
to = "/pricing"
status = 301

[[redirects]]
from = "/webinars/*"
to = "/lectures"
status = 301

[[redirects]]
from = "/white-papers/*"
to = "/papers"
status = 301

[[redirects]]
from = "/docs/reference/typeql/*"
to = "/docs/typeql-reference/:splat"
status = 301

[[redirects]]
from = "/docs/llms-short.txt"
to = "/docs/llms-full.txt"
status = 301

[[redirects]]
from = "/fundamentals/symbolic-reasoning-engine"
to = "/docs/typeql-reference/functions/functions-vs-rules/"
