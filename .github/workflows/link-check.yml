name: Link check

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      # The docs have their own sitemaps under /docs; this repo only serves sitemap-main.xml
      - name: List site pages
        run: |
          urls=$(curl -sf https://typedb.com/sitemap-main.xml | grep -oE '<loc>[^<]+' | sed 's/<loc>//' | tr '\n' ' ')
          echo "SITE_URLS=$urls" >> "$GITHUB_ENV"

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --max-concurrency 8
            --accept 200..=299,403,429
            ${{ env.SITE_URLS }}
          fail: false

      - name: Report broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links report
          content-filepath: ./lychee/out.md
          labels: broken-links
