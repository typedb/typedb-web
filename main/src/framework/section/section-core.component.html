<div class="td-text">
  @if (section.eyebrow) {
    <p class="td-eyebrow">{{ section.eyebrow }}</p>
  }
  @if (section.title.spans.length) {
    <td-heading-with-highlights [value]="section.title" [level]="level" />
  }
  @if (section.body && !noBody) {
    <td-rich-text [value]="section.body" class="subtitle-l" [class]="'text-' + bodyLevel" />
  }
  <td-actions [actions]="section.actions" [sectionId]="section.sectionId" />
</div>
@if (hasIllustration) {
  <div class="td-illustration-wrapper">
    <div class="illustration-container light-mode">
      @if (hasPeekingBot) {
        <img class="tp-logo" src="assets/logo/typedb-bot.svg" alt="TypeDB"/>
      }

      <td-illustration [class]="hasCodeSnippetIllustration ? '' : ''" [illustration]="illustration!" [priority]="isIntroSection" />
    </div>
  </div>
}
