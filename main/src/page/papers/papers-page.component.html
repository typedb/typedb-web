<article>
  @if (page$ | async; as page) {
    <td-section-core [section]="page.introSection"/>
    <div class="subsection-margin card-appearance narrow-section wp-grid">
      <div class="wp-grid-item wp-primary-paper">
        <h2 class="wp-paper-title wp-primary-paper-title">{{ page.featuredPaper.title | plainText }}</h2>
        <div class="wp-primary-paper-details">
          <td-aspect-ratio ratio="16:9" class="hide-gt-mobile">
            <a [tdLink]="page.featuredPaper.detailsPageLink()" class="wp-img-link" [attr.aria-label]="page.featuredPaper.title | plainText">
              <img [ngSrc]="page.featuredPaper.landscapeImageURL!" class="wp-img" alt="" fill />
            </a>
          </td-aspect-ratio>
          <td-aspect-ratio ratio="17:22" class="hide-mobile">
            <a [tdLink]="page.featuredPaper.detailsPageLink()" class="wp-img-link" [attr.aria-label]="page.featuredPaper.title | plainText">
              <img [ngSrc]="page.featuredPaper.portraitImageURL!" class="wp-img" alt="" fill />
            </a>
          </td-aspect-ratio>
          <div class="wp-primary-paper-summary">
            <td-rich-text class="wp-primary-paper-description" [value]="page.featuredPaper.description" />
            <div class="flex"></div>
            <td-button
              [button]="accessResourceButton(page.featuredPaper, 'greenHollow', 'Read')"
              [linkId]="downloadButtonId(page.featuredPaper)"
            />
          </div>
        </div>
      </div>
      @for (paper of page.papersList; track paper) {
        <div class="wp-grid-item">
          <div class="wp-img-and-text">
            @if (paper.landscapeImageURL) {
              <td-aspect-ratio ratio="16:9" class="wp-img-secondary-container">
                <a [tdLink]="paper.detailsPageLink()" class="wp-img-link" [attr.aria-label]="paper.title | plainText">
                  <img [ngSrc]="paper.landscapeImageURL" class="wp-img" alt="" fill />
                </a>
              </td-aspect-ratio>
            }
            <div>
              <h3 class="wp-paper-title wp-grid-item-title">{{ paper.title | plainText }}</h3>
            </div>
          </div>
          <td-rich-text class="wp-grid-item-description" [value]="paper.description" />
          <td-button
            [button]="accessResourceButton(paper, 'greenHollow', 'Read')"
            size="small" buttonWidth="100%" [linkId]="downloadButtonId(paper)"
          />
        </div>
      }
      @if (page.papersList.length % 2) {
        <div class="wp-grid-item wp-grid-filler"></div>
      }
    </div>
  }
</article>
