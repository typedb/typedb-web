<article>
  @if (page$ | async; as paper) {
    <div class="resource-section narrow-section">
      <nav class="wd-breadcrumb" aria-label="Breadcrumb">
        <a tdLink="/research">TypeDB Research</a>
        <span aria-hidden="true">/</span>
        <span class="wd-breadcrumb-current">{{ paper.title | plainText }}</span>
      </nav>
      <td-heading-with-highlights [value]="paper.title" level="h1" />
      @if (actions$ | async; as actions) {
        <td-actions [actions]="actions" class="wd-actions" sectionId="main" />
      }
      <div class="subsection-margin card wd-form-card">
        @if (paper.portraitImageURL) {
          <td-aspect-ratio ratio="17:22">
            <img [ngSrc]="paper.portraitImageURL" class="wd-img" [alt]="paper.title" fill />
          </td-aspect-ratio>
        }
        <td-rich-text class="wd-description" [value]="paper.description" />
      </div>
      @if (paper.furtherLearning) {
        <td-further-learning [value]="paper.furtherLearning" />
      }
    </div>
  }
</article>
